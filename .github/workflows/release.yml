name: Release AppImage

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust & MUSL Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y file wget libfuse2 musl-tools

      - name: Install appimagetool
        run: |
          sudo wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Install cargo-appimage
        run: cargo install cargo-appimage

      - name: Build Rust Project (MUSL)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Prepare Binary for AppImage
        run: |
          mkdir -p target/release
          cp target/x86_64-unknown-linux-musl/release/display-tui target/release/

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo appimage

      - name: Rename AppImage with Tag
        run: |
          cd target/appimage
          mv display-tui.AppImage display-tui-${{ github.ref_name }}.AppImage

      - name: Create Release and Upload AppImage
        uses: softprops/action-gh-release@v3
        with:
          files: "target/appimage/display-tui-*.AppImage"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
