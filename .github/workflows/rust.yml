name: Rust

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: "1.99.1"
        components: clippy, rustfmt

    - name: Cache cargo
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: Run checks and tests
      run: |
        cargo fmt --check
        cargo clippy --all-targets -- -D warnings
        cargo test --verbose

    - name: Build release binary
      run: cargo build --release --verbose

    - name: Set build name
      id: build
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          name="$GITHUB_REF_NAME"
        else
          name="${GITHUB_SHA::7}"
        fi
        echo "name=$name" >> "$GITHUB_OUTPUT"

    - name: Package release binary
      env:
        BUILD_NAME: ${{ steps.build.outputs.name }}
      run: |
        mkdir -p dist
        cp target/release/hegn "dist/hegn-${BUILD_NAME}-x86_64-linux-gnu"

    - name: Upload build artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: hegn-${{ steps.build.outputs.name }}-x86_64-linux-gnu
        path: dist/hegn-*-x86_64-linux-gnu
        if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Download the built binary
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        pattern: hegn-*
        merge-multiple: true
        path: dist

    - name: Upload binary to GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: "dist/hegn-*-x86_64-linux-gnu"
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
