name: Rust

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0 # Holt die gesamte Historie für die Commit-Schleife

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: "1.99.1"
        components: clippy, rustfmt

    - name: Cache cargo
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: Run checks and tests on each commit
      run: |
        ORIGINAL_SHA=$(git rev-parse HEAD)

        BEFORE=""
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BEFORE="${{ github.event.pull_request.base.sha }}"
        elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
          BEFORE="${{ github.event.before }}"
        fi

        if [ -n "$BEFORE" ] && git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
          COMMITS=$(git rev-list --reverse ${BEFORE}..HEAD)
        else
          COMMITS="$ORIGINAL_SHA"
        fi

        for commit in $COMMITS; do
          echo "::group::Testing commit $commit"
          git checkout --detach "$commit"
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --verbose
          echo "::endgroup::"
        done

        # Git-Status auf das ursprüngliche Push-Ziel zurücksetzen für den Release-Build
        git checkout "$ORIGINAL_SHA"

    - name: Build release binary
      run: cargo build --release --verbose

    - name: Set build name
      id: build
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          name="$GITHUB_REF_NAME"
        else
          name="${GITHUB_SHA::7}"
        fi
        echo "name=$name" >> "$GITHUB_OUTPUT"

    - name: Package release binary
      env:
        BUILD_NAME: ${{ steps.build.outputs.name }}
      run: |
        mkdir -p dist
        cp target/release/hegn "dist/hegn-${BUILD_NAME}-x86_64-linux-gnu"

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: hegn-${{ steps.build.outputs.name }}-x86_64-linux-gnu
        path: dist/hegn-*-x86_64-linux-gnu
        if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Download the built binary
      uses: actions/download-artifact@v8
      with:
        pattern: hegn-*
        merge-multiple: true
        path: dist

    - name: Upload binary to GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: "dist/hegn-*-x86_64-linux-gnu"
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
