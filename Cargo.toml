[package]
name = "hegn"
version = "0.1.0"
edition = "2024"
description = "Firecracker MicroVM sandbox manager and TUI for agentic coding"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "7.0.0"
hex = "0.4.3"
libc = "0.2.191"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "rustls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tirith-core = "0.4.2"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
